# docker/nginx.prod.conf
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Configuración de rendimiento
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Compresión
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml font/truetype font/opentype
             application/vnd.ms-fontobject image/svg+xml;

  # Logs
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # ───────────────────────────────────────────────────────────────────────────
  # Servidor por defecto: cierra la conexión sin responder.
  #
  # Antes el único server usaba `server_name _`, es decir aceptaba cualquier
  # Host. Con `default_server` aquí, todo lo que no coincida con el server
  # real de abajo (escáneres, Host inventado, sondas por IP) se corta sin
  # generar respuesta ni llegar a Flask.
  # ───────────────────────────────────────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 80;

    # Nombre público real del sistema.
    #
    # El proxy de borde del host reenvía con `proxy_set_header Host $host`, es
    # decir el nombre que pidió el cliente: siiap.cdjuarez.tecnm.mx. Ese es el
    # canónico y tiene que estar aquí — si falta, la petición no casa con este
    # server, cae al default_server y el sitio responde 444.
    #
    # siiapec es un alias: el borde lo redirige con 301 al canónico, así que en
    # la práctica nunca llega con ese Host. Se acepta por si alguien reconfigura
    # el borde para proxearlo en vez de redirigirlo.
    #
    # localhost y 127.0.0.1 se conservan para el healthcheck y para sondas
    # locales dentro del host.
    server_name siiap.cdjuarez.tecnm.mx siiapec.cdjuarez.tecnm.mx localhost 127.0.0.1;

    # ─────────────────────────────────────────────────────────────────────────
    # IP real del cliente.
    #
    # El contenedor publica en 127.0.0.1:8081 y un proxy de borde que NO vive
    # en este repositorio termina TLS delante. Además Docker hace NAT en el
    # puerto publicado, así que $remote_addr es SIEMPRE la gateway del bridge
    # (172.x.0.1) y X-Real-IP / X-Forwarded-For acaban con ese mismo valor
    # inútil para todos los clientes del mundo.
    #
    # real_ip_header sólo reescribe $remote_addr si la conexión viene de una
    # dirección declarada en set_real_ip_from.
    #
    # El puerto se publica SOLO en 127.0.0.1:8081, así que lo único que puede
    # abrir esta conexión es un proceso del propio host — en la práctica el
    # nginx de borde — y Docker lo presenta con la gateway del bridge. Por eso
    # basta con confiar en los rangos privados: nada de fuera del host puede
    # llegar aquí a falsear una cabecera.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    # `off` a propósito, no `on`. Hay exactamente un salto de confianza, así
    # que la última entrada de X-Forwarded-For es siempre la que escribió el
    # borde: la IP real del cliente. Con `on`, nginx caminaría la cadena hacia
    # la izquierda saltándose direcciones privadas, y un cliente que llega
    # desde la red interna acabaría resolviendo a lo que él mismo mandó en la
    # cabecera.
    real_ip_recursive off;

    # NO se añade limit_req / limit_conn aquí: el borde ya limita por IP y allí
    # $binary_remote_addr sí es el cliente real de primera mano. Duplicarlo en
    # este salto sólo añade un segundo sitio donde equivocarse.

    # Host público canónico — el que el borde reenvía y al que redirige el
    # alias siiapec. Fuente única de verdad para lo que se le dice a Flask;
    # debe coincidir con APP_BASE_URL de la aplicación.
    set $app_public_host "siiap.cdjuarez.tecnm.mx";

    # Un poco por encima de MAX_CONTENT_LENGTH (5 MB en app/config.py) para que
    # sea Flask quien rechace el exceso con el envelope de la app, y no nginx
    # con su 413 en HTML. Estaba en 3M, por debajo del límite de la app: las
    # imágenes de evento de 3 a 5 MB morían aquí antes de llegar a validarse.
    client_max_body_size 6M;

    # ─────────────────────────────────────────────────────────────────────────
    # Cabeceras de seguridad de respuesta.
    #
    # `always` para que también salgan en respuestas de error (4xx/5xx).
    # NO se añade Content-Security-Policy: necesita su propio lote — la app
    # carga Bootstrap y scripts inline y una CSP mal calibrada rompe páginas
    # en silencio.
    # ─────────────────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Archivos estáticos con caché agresivo
    location /static/ {
      alias /usr/share/nginx/html/static/;

      # add_header NO se hereda si el bloque define los suyos: hay que repetir
      # las cabeceras de seguridad aquí o /static/ se queda sin ellas.
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      expires 1y;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Cadena de proxy determinista.
    #
    # Flask corre con ProxyFix(x_for=1, x_proto=1, x_host=1, x_port=1). Con
    # x_host=1 activo, fijar sólo `Host` no basta: ProxyFix prefiere
    # X-Forwarded-Host y sobrescribe con él HTTP_HOST y SERVER_NAME. Antes
    # nginx no fijaba ni borraba esa cabecera, así que un X-Forwarded-Host
    # enviado por el cliente llegaba intacto y mandaba sobre el Host.
    #
    # De las dos opciones (fijar ambas cabeceras aquí, o quitar x_host de
    # ProxyFix) se fija aquí: app/__init__.py se está tocando en paralelo y,
    # sobre todo, el saneamiento pertenece al borde de confianza — quien
    # decide qué se cree de una petición es el proxy, no la aplicación. Así la
    # app sigue siendo correcta aunque alguien vuelva a activar x_host.
    #
    # X-Forwarded-Port se BORRA (valor vacío = nginx no emite la cabecera):
    # ProxyFix con x_port=1 le pegaría ese puerto al host (`host:443`) y
    # ensuciaría cualquier URL derivada de la petición. Vacía, x_port no hace
    # nada.
    # ─────────────────────────────────────────────────────────────────────────

    # Socket.IO (preparado para futuro)
    location /socket.io/ {
      proxy_pass http://web:5000/socket.io/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $app_public_host;
      proxy_set_header X-Forwarded-Host $app_public_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header X-Real-IP $remote_addr;
      # $remote_addr, NO $proxy_add_x_forwarded_for. Tras real_ip esta
      # variable ya es la IP real del cliente, y mandarla sola descarta la
      # cadena que el cliente haya podido inyectar en su propia cabecera.
      # Con la cadena acumulada, ProxyFix(x_for=1) acierta por casualidad;
      # asi acierta por construccion.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 86400;
    }

    # Aplicación principal
    location / {
      proxy_pass http://web:5000;
      proxy_set_header Host $app_public_host;
      proxy_set_header X-Forwarded-Host $app_public_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header X-Real-IP $remote_addr;
      # $remote_addr, NO $proxy_add_x_forwarded_for. Tras real_ip esta
      # variable ya es la IP real del cliente, y mandarla sola descarta la
      # cadena que el cliente haya podido inyectar en su propia cabecera.
      # Con la cadena acumulada, ProxyFix(x_for=1) acierta por casualidad;
      # asi acierta por construccion.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;

      # Timeouts para aplicación en producción
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
