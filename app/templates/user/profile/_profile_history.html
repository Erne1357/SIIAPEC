{% from '_macros.html' import async_region, skeleton_text_block %}
<section class="card" aria-labelledby="historyTitle">
    <div class="card-header">
        <h2 class="h5 mb-0" id="historyTitle">
            <i class="bi bi-clock-history me-2" aria-hidden="true"></i>
            Historial de acciones
        </h2>
    </div>
    <div class="card-body">
        {% call async_region('historyContent', 'Historial de acciones') %}
          <div id="historyTimeline"></div>
          {{ skeleton_text_block(lines=4) }}
        {% endcall %}
    </div>
</section>
