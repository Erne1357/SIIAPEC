{% from '_macros.html' import async_region, skeleton_text_block %}
<section class="card" aria-labelledby="notificationsTitle">
    <div class="card-header">
        <div class="row align-items-center g-2">
            <div class="col">
                <h2 class="h5 mb-0" id="notificationsTitle">
                    <i class="bi bi-bell me-2" aria-hidden="true"></i>
                    Notificaciones
                </h2>
            </div>
            <div class="col-auto d-flex flex-wrap gap-2">
                <div class="btn-group btn-group-sm" role="group" aria-label="Filtro de notificaciones">
                    <button type="button" class="btn btn-outline-primary active"
                            id="filterAllNotifications" aria-pressed="true">
                        Todas
                    </button>
                    <button type="button" class="btn btn-outline-primary"
                            id="filterUnreadNotifications" aria-pressed="false">
                        No leídas
                    </button>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="markAllNotificationsRead"
                        aria-label="Marcar todas las notificaciones como leídas">
                    <i class="bi bi-check-all me-1" aria-hidden="true"></i>
                    <span class="d-none d-md-inline">Marcar todas leídas</span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" id="clearReadNotifications"
                        aria-label="Eliminar las notificaciones ya leídas">
                    <i class="bi bi-trash me-1" aria-hidden="true"></i>
                    <span class="d-none d-md-inline">Eliminar leídas</span>
                </button>
            </div>
        </div>
    </div>

    <div class="card-body">
        <!-- Filtros adicionales -->
        <div class="row mb-3 notification-filters g-2">
            <div class="col-md-6">
                <label class="visually-hidden" for="filterNotificationType">Filtrar notificaciones por tipo</label>
                <select class="form-select form-select-sm" id="filterNotificationType">
                    <option value="">Todos los tipos</option>
                    <option value="document">Documentos</option>
                    <option value="event">Eventos y citas</option>
                    <option value="invitation">Invitaciones</option>
                    <option value="admin">Administrativas</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="visually-hidden" for="searchNotifications">Buscar en las notificaciones</label>
                <input type="search" class="form-control form-control-sm" id="searchNotifications"
                       placeholder="Buscar notificaciones…">
            </div>
        </div>

        <!-- Contenedor de notificaciones -->
        {% call async_region('notificationsFull', 'Listado de notificaciones') %}
          {{ skeleton_text_block(lines=4) }}
        {% endcall %}

        <!-- Paginación -->
        <nav class="mt-4" aria-label="Paginación de notificaciones">
            <ul class="pagination justify-content-center" id="notificationsPagination">
                <!-- Se llena dinámicamente -->
            </ul>
        </nav>
    </div>
</section>
